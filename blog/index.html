<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.2/dist/terminal.min.css">
  <link rel="stylesheet" href="../static/css/custom.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div>
        <a href="../" class="site-title-link">
          <h1 class="site-title">Mongkon Kamprom Website</h1>
        </a>
        <div class="tagline">Solutions Architect &middot; Senior DevOps &amp; Platform Engineer</div>
      </div>
      <div class="header-controls">
        <nav class="site-nav">
          <a href="../">Home</a>
          <a href="../about/">About</a>
          <a href="./">Blog</a>
          <a href="../projects/">Projects</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          Theme: Light
        </button>
      </div>
    </header>

    <main>
      
  <section>
    <h2>Blog</h2>
    <p>Articles on cloud architecture, Kubernetes, backend engineering, and distributed systems.</p>

    <div class="posts-list">
      
        <p>No posts published yet.</p>
      
    </div>

    
  </section>

    </main>

    <footer class="site-footer">
      <a class="nav-link" href="https://github.com/adthonb" target="_blank" rel="noopener">GitHub</a>
      &middot;
      <a class="nav-link" href="https://www.linkedin.com/in/mongkon-kp" target="_blank" rel="noopener">LinkedIn</a>
    </footer>
  </div>

  <script>
    (function () {
      const toggleBtn = document.getElementById('theme-toggle');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let storedTheme = null;
      try {
        storedTheme = localStorage.getItem('theme');
      } catch (e) {}

      function setTheme(theme) {
        if (theme === 'dark') {
          document.body.classList.add('dark-mode');
          toggleBtn.textContent = 'Theme: Dark';
        } else {
          document.body.classList.remove('dark-mode');
          toggleBtn.textContent = 'Theme: Light';
        }
        try {
          localStorage.setItem('theme', theme);
        } catch (e) {}
      }

      if (storedTheme) {
        setTheme(storedTheme);
      } else if (prefersDark) {
        setTheme('dark');
      } else {
        setTheme('light');
      }

      toggleBtn.addEventListener('click', function () {
        const isDark = document.body.classList.contains('dark-mode');
        setTheme(isDark ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
